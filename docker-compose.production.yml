services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    env_file: .env.production
    command: ["uvicorn", "wde_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    env_file: .env.production
    command: ["python", "-m", "wde_api.worker"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1536m
    cpus: 2.0
    stop_grace_period: 45s

# Supabase PostgreSQL/Storage and Upstash Redis are external managed services.
# This topology intentionally defines no local database, Redis, artifact volume, worker port, or browser-debug port.
