[project]
name = "web-data-extraction-engine"
version = "0.2.0"
description = "A modular web data extraction engine with durable backend job orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Gulshan Kumar" },
]
dependencies = [
    "alembic>=1.14,<2",
    "arq>=0.26,<1",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "playwright>=1.50,<2",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24.4,<26",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["services/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests", "services/api/tests"]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["services/api/src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
